<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Panel administrativo de eventos Hidden Room."><title>Administrar eventos | Hidden Room</title><link rel="icon" type="image/webp" href="../assets/img/orange_logo.webp"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="../styles-20260809.css?v=20261019-footer-mysauth-logo-v2"><link rel="stylesheet" href="../portal/dashboard.css?v=20261019-client-membership-layout-v1"></head>
<body class="db-body events-admin-page hr-page" data-hr-chrome data-hr-context="events" data-hr-footer="false"><div id="hr-global-nav"></div>
<main class="db-main hr-section" aria-labelledby="events-admin-title"><div class="hr-container hr-stack hr-stack-xl"><header class="db-section__header"><p class="hr-eyebrow">Eventos / Administración</p><h1 class="db-section__title" id="events-admin-title">Panel de eventos</h1><p class="hr-subtitle">Crea eventos para la cartelera pública o para control interno.</p></header><p id="events-admin-status" class="db-empty" role="status">Verificando permisos…</p>
<section id="events-admin-panel" class="db-admin-grid db-admin-grid--single" hidden><article class="db-card"><header class="db-card__header"><span class="section-label">Nuevo evento</span></header><div class="db-card__inner"><form class="db-form" id="events-admin-form">
<div class="db-form__row"><label class="db-field"><span>Clave del evento</span><input name="event_key" required></label><label class="db-field"><span>Nombre</span><input name="name" required></label></div>
<div class="db-form__row"><label class="db-field"><span>Fecha</span><input name="event_date" type="date"></label><label class="db-field"><span>Status</span><select name="status"><option value="draft">draft</option><option value="active" selected>active</option><option value="closed">closed</option><option value="cancelled">cancelled</option></select></label></div>
<div class="db-form__row"><label class="db-field"><span>Visibilidad</span><select name="visibility"><option value="private" selected>Privado</option><option value="public">Público</option></select></label><label class="db-field"><span>Venue</span><input name="venue"></label></div>
<div class="db-form__row"><label class="db-field"><span>Ciudad</span><input name="city"></label><label class="db-field"><span>Notas</span><textarea name="notes" rows="3"></textarea></label></div><button class="btn-primary" type="submit">Crear evento</button></form></div></article></section>
<section id="events-admin-list" class="db-admin-grid db-admin-grid--single" hidden><article class="db-card"><header class="db-card__header"><span class="section-label">Eventos registrados</span></header><div class="db-card__inner"><div id="events-admin-table"></div></div></article></section></div></main>
<script src="../site.js?v=20261019-footer-mysauth-logo-v2"></script><script src="admin.js?v=20261006-events-admin-table-v1"></script></body></html>
