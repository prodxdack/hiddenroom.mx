<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cat?logo de productor en Hidden Room Beat Store.">
  <title>Productor | Hidden Room Beat Store</title>
  <link rel="icon" type="image/webp" href="../../assets/img/orange_logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=20261019-footer-mysauth-logo-v2">

</head>
<body class="store-page beat-store-page producer-page hr-page" data-page="beat-producer" data-hr-chrome data-hr-context="store">
  <div id="hr-global-nav"></div>

  <main>
    <section class="producer-profile-hero" id="producer-hero">
      <div class="producer-profile-hero__cover" id="producer-cover"></div>
      <div class="producer-profile-hero__content hr-container">
        <div class="producer-profile-hero__avatar-wrap">
          <div class="producer-profile-hero__avatar" id="producer-avatar">HR</div>
          <div class="producer-avatar-actions" id="producer-avatar-actions" hidden>
            <label class="secondary-button producer-avatar-change" for="producer-avatar-file">Cambiar foto<input id="producer-avatar-file" type="file" accept="image/*,.jpg,.jpeg,.png,.webp" hidden></label>
          </div>
          <div id="producer-avatar-editor" class="beat-cover-editor producer-avatar-editor" hidden>
            <div class="beat-cover-editor__stage" id="producer-avatar-stage" aria-label="Recorte de foto de perfil">
              <img id="producer-avatar-preview" alt="Vista previa de la foto de perfil">
            </div>
            <div class="beat-cover-editor__controls">
              <button id="producer-avatar-reset" class="secondary-button" type="button">Restablecer recorte</button>
              <label class="hr-label" for="producer-avatar-zoom">Zoom <input id="producer-avatar-zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
              <div class="producer-avatar-editor__actions">
                <button id="producer-avatar-save" class="primary-button" type="button">Guardar foto</button>
                <button id="producer-avatar-cancel" class="secondary-button" type="button">Cancelar</button>
              </div>
              <p id="producer-avatar-status" class="producer-avatar-status" role="status" aria-live="polite"></p>
            </div>
          </div>
        </div>
        <div>
          <a class="producer-profile-hero__back" href="./">Beat Store</a>
          <h1 id="producer-name">Productor</h1>
          <p id="producer-bio">Cargando perfil...</p>
          <div class="producer-profile-hero__links" id="producer-links"></div>
        </div>
      </div>
    </section>

    <section class="catalog-section hr-section" aria-label="Catálogo de beats">
      <div class="hr-container hr-stack hr-stack-xl">
        <div id="producer-beat-grid" class="product-grid beat-grid"></div>
      </div>
    </section>
  </main>

  <div id="store-notice" class="notice hr-toast" role="status" aria-live="polite"></div>
  <div id="beat-license-modal" class="beat-license-modal" hidden>
    <div class="beat-license-modal__backdrop" data-license-modal-close></div>
    <section class="beat-license-modal__panel" role="dialog" aria-modal="true" aria-label="Seleccionar una opción">
      <button class="beat-license-modal__close" type="button" data-license-modal-close aria-label="Cerrar">X</button>
      <div id="beat-license-modal-content"></div>
    </section>
  </div>

  <script src="../../site.js?v=20261019-footer-mysauth-logo-v2"></script>
  <script src="/spa.js?v=20261004-site-copy-editor-v1"></script>
  <script type="module" src="producer.js?v=20261019-producer-page-scroll-v3"></script>
</body>
</html>
